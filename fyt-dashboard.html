<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Find Your Time — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0800; --bg-card: #0f0c00; --bg-input: #1a1400;
      --gold: #ffd700; --gold-2: #c89600; --gold-muted: #806030;
      --gold-dark: #604820; --text: #e8d080; --border: rgba(200,150,0,0.18);
      --green: #4a9660; --red: #c84000;
    }
    body {
      min-height: 100vh; background: var(--bg);
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--text); padding-bottom: 100px;
      overflow-x: hidden;
    }

    /* NAV */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: #0a0800f0; backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-logo { font-size: 18px; }
    .topbar-title { font-size: 16px; font-weight: 700;
      background: linear-gradient(135deg, var(--gold-2), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-2), var(--gold));
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #0a0800;
      cursor: pointer; font-family: 'DM Mono', monospace;
    }

    /* MAIN */
    .page { max-width: 480px; margin: 0 auto; padding: 24px 16px; }

    /* GREETING */
    .greeting { margin-bottom: 24px; animation: fadeUp 0.5s ease; }
    .greeting h2 { font-size: 28px; font-weight: 700; color: var(--gold); line-height: 1.2; }
    .greeting p { font-size: 12px; color: var(--gold-dark);
      font-family: 'DM Mono', monospace; letter-spacing: 1px; margin-top: 4px; }

    /* CARDS */
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; padding: 16px; margin-bottom: 14px;
      animation: fadeUp 0.5s ease;
    }
    .card-label {
      font-size: 10px; color: var(--gold-muted);
      font-family: 'DM Mono', monospace; letter-spacing: 2px; margin-bottom: 10px;
    }

    /* IA MESSAGE */
    .ia-card {
      background: linear-gradient(135deg, rgba(200,150,0,0.08), rgba(255,215,0,0.04));
      border-color: rgba(200,150,0,0.3);
    }
    .ia-message { font-size: 15px; font-style: italic; line-height: 1.7; color: var(--text); }

    /* STATS ROW */
    .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px; }
    .stat-box {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 10px; text-align: center;
      animation: fadeUp 0.5s ease;
    }
    .stat-num { font-size: 26px; font-weight: 700; color: var(--gold); line-height: 1; }
    .stat-lbl { font-size: 10px; color: var(--gold-dark);
      font-family: 'DM Mono', monospace; letter-spacing: 1px; margin-top: 4px; }

    /* SCORE BARS */
    .score-bar { margin-bottom: 10px; }
    .score-bar-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .score-bar-label { font-size: 11px; color: var(--gold-muted);
      font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    .score-bar-val { font-size: 11px; font-weight: 700; font-family: 'DM Mono', monospace; }
    .score-bar-track { height: 5px; background: #1a1400; border-radius: 3px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 3px; transition: width 1s ease; }

    /* JOURS SCROLL */
    .days-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
    .days-scroll::-webkit-scrollbar { display: none; }
    .day-chip {
      flex-shrink: 0; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 14px; cursor: pointer; transition: all 0.2s;
      text-align: center; min-width: 60px;
    }
    .day-chip.active {
      background: linear-gradient(135deg, var(--gold-2), var(--gold));
      border-color: transparent;
    }
    .day-chip .day-name { font-size: 11px; font-family: 'DM Mono', monospace;
      color: var(--gold-muted); letter-spacing: 1px; }
    .day-chip.active .day-name { color: #0a0800; }
    .day-chip .day-count { font-size: 18px; font-weight: 700; color: var(--gold); margin-top: 2px; }
    .day-chip.active .day-count { color: #0a0800; }
    .day-chip .day-date { font-size: 9px; color: var(--gold-dark); font-family: 'DM Mono', monospace; }
    .day-chip.active .day-date { color: rgba(10,8,0,0.6); }

    /* TÂCHES */
    .task-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; border-radius: 12px; margin-bottom: 8px;
      border: 1px solid transparent; transition: all 0.2s;
      animation: slideIn 0.3s ease;
      cursor: pointer;
    }
    .task-item:hover { transform: translateX(2px); }
    .task-item.scolaire { background: rgba(200,150,0,0.08); border-color: rgba(200,150,0,0.2); }
    .task-item.perso    { background: rgba(255,215,0,0.06);  border-color: rgba(255,215,0,0.15); }
    .task-item.repos    { background: rgba(74,150,96,0.08);  border-color: rgba(74,150,96,0.2); }
    .task-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .task-dot.scolaire { background: var(--gold-2); }
    .task-dot.perso    { background: var(--gold); }
    .task-dot.repos    { background: var(--green); }
    .task-info { flex: 1; min-width: 0; }
    .task-title { font-size: 14px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-title.done { text-decoration: line-through; color: var(--gold-dark); }
    .task-meta { font-size: 10px; color: var(--gold-dark);
      font-family: 'DM Mono', monospace; margin-top: 2px; }
    .task-check {
      width: 22px; height: 22px; border-radius: 6px;
      border: 1px solid var(--border); background: transparent;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 12px; flex-shrink: 0; transition: all 0.2s;
    }
    .task-check.checked { background: var(--green); border-color: var(--green); }

    /* EMPTY STATE */
    .empty { text-align: center; padding: 32px 20px; color: var(--gold-dark);
      font-style: italic; font-size: 14px; }
    .empty span { font-size: 32px; display: block; margin-bottom: 10px; opacity: 0.4; }

    /* FAB */
    .fab {
      position: fixed; bottom: 28px; right: 20px; z-index: 30;
      width: 58px; height: 58px; border-radius: 18px;
      background: linear-gradient(135deg, var(--gold-2), var(--gold));
      border: none; font-size: 26px; cursor: pointer;
      box-shadow: 0 8px 32px rgba(255,215,0,0.3);
      transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .fab:hover { transform: scale(1.08); box-shadow: 0 12px 40px rgba(255,215,0,0.4); }
    .fab:active { transform: scale(0.95); }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      background: #0a0800f0; backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 10px 0 16px;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      cursor: pointer; padding: 4px 16px; border-radius: 10px;
      transition: all 0.2s; color: var(--gold-dark);
      font-size: 10px; font-family: 'DM Mono', monospace; letter-spacing: 0.5px;
    }
    .nav-item.active { color: var(--gold); }
    .nav-item span:first-child { font-size: 20px; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--bg-card); border: 1px solid rgba(74,150,96,0.4);
      border-radius: 12px; padding: 10px 20px;
      color: #7dc98a; font-size: 12px; font-family: 'DM Mono', monospace;
      transition: transform 0.3s; z-index: 100; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideIn { from { opacity:0; transform:translateX(-8px); } to { opacity:1; transform:translateX(0); } }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">⏳</span>
      <span class="topbar-title">Find Your Time</span>
    </div>
    <div class="avatar" id="avatar" onclick="logout()">?</div>
  </div>

  <!-- PAGE -->
  <div class="page">

    <!-- Greeting -->
    <div class="greeting">
      <h2 id="greeting-text">Bonjour 👋</h2>
      <p id="greeting-date"></p>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-lbl">TÂCHES</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-done" style="color:#4a9660">0</div>
        <div class="stat-lbl">FAITES</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-pending" style="color:#c89600">0</div>
        <div class="stat-lbl">EN COURS</div>
      </div>
    </div>

    <!-- Message IA -->
    <div class="card ia-card">
      <div class="card-label">✦ MESSAGE DE TON IA</div>
      <div class="ia-message" id="ia-message">
        Ajoute tes premières tâches pour que je génère ton planning personnalisé. 🌟
      </div>
    </div>

    <!-- Équilibre -->
    <div class="card">
      <div class="card-label">⚖ ÉQUILIBRE DE LA SEMAINE</div>
      <div class="score-bar">
        <div class="score-bar-header">
          <span class="score-bar-label">SCOLAIRE</span>
          <span class="score-bar-val" id="score-scolaire" style="color:var(--gold-2)">0%</span>
        </div>
        <div class="score-bar-track">
          <div class="score-bar-fill" id="bar-scolaire" style="background:var(--gold-2); width:0%"></div>
        </div>
      </div>
      <div class="score-bar">
        <div class="score-bar-header">
          <span class="score-bar-label">PERSO</span>
          <span class="score-bar-val" id="score-perso" style="color:var(--gold)">0%</span>
        </div>
        <div class="score-bar-track">
          <div class="score-bar-fill" id="bar-perso" style="background:var(--gold); width:0%"></div>
        </div>
      </div>
      <div class="score-bar">
        <div class="score-bar-header">
          <span class="score-bar-label">REPOS</span>
          <span class="score-bar-val" id="score-repos" style="color:var(--green)">0%</span>
        </div>
        <div class="score-bar-track">
          <div class="score-bar-fill" id="bar-repos" style="background:var(--green); width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Jours -->
    <div class="card-label" style="padding:0 4px; margin-bottom:10px;">📅 CETTE SEMAINE</div>
    <div class="days-scroll" id="days-scroll"></div>

    <!-- Tâches du jour -->
    <div class="card">
      <div class="card-label" id="tasks-label">TÂCHES DU JOUR</div>
      <div id="tasks-list"></div>
    </div>

    <!-- Bouton planning -->
    <button onclick="goToPlanning()" style="
      width:100%; padding:14px;
      background: linear-gradient(135deg, rgba(200,150,0,0.15), rgba(255,215,0,0.08));
      border: 1px solid rgba(200,150,0,0.3); border-radius:14px;
      color: var(--gold); font-size:14px; font-weight:600;
      font-family:'Cormorant Garamond',serif; cursor:pointer;
      letter-spacing:1px; transition:all 0.2s; margin-bottom:8px;
    ">✨ Générer mon planning IA →</button>

  </div>

  <!-- FAB -->
  <button class="fab" onclick="goToAddTask()" title="Ajouter une tâche">+</button>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <span>🏠</span><span>Accueil</span>
    </div>
    <div class="nav-item" onclick="goToAddTask()">
      <span>➕</span><span>Tâche</span>
    </div>
    <div class="nav-item" onclick="goToPlanning()">
      <span>📅</span><span>Planning</span>
    </div>
    <div class="nav-item" onclick="logout()">
      <span>👤</span><span>Profil</span>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    // ── Données ─────────────────────────────────────────────────
    const JOURS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
    const DATES = getWeekDates();
    let activeDay = new Date().getDay(); // 0=dim, 1=lun...
    if (activeDay === 0) activeDay = 6; else activeDay -= 1;

    function getWeekDates() {
      const today = new Date();
      const day = today.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      const mon = new Date(today); mon.setDate(today.getDate() + diff);
      return Array.from({length:7}, (_,i) => {
        const d = new Date(mon); d.setDate(mon.getDate()+i);
        return d.getDate() + ' ' + ['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct','nov','déc'][d.getMonth()];
      });
    }

    // ── Utilisateur ──────────────────────────────────────────────
    let user = JSON.parse(localStorage.getItem('fyt_current_user') || 'null');
    if (!user) { window.location.href = 'fyt-login.html'; }

    function getUserTasks() {
      const users = JSON.parse(localStorage.getItem('fyt_users') || '[]');
      const u = users.find(u => u.email === user.email);
      return u ? (u.tasks || []) : [];
    }

    function saveTask(task) {
      const users = JSON.parse(localStorage.getItem('fyt_users') || '[]');
      const idx = users.findIndex(u => u.email === user.email);
      if (idx === -1) return;
      if (!users[idx].tasks) users[idx].tasks = [];
      users[idx].tasks.push(task);
      localStorage.setItem('fyt_users', JSON.stringify(users));
      user = users[idx];
      localStorage.setItem('fyt_current_user', JSON.stringify(user));
    }

    function toggleTask(taskId) {
      const users = JSON.parse(localStorage.getItem('fyt_users') || '[]');
      const idx = users.findIndex(u => u.email === user.email);
      if (idx === -1) return;
      const t = users[idx].tasks.find(t => t.id === taskId);
      if (t) t.done = !t.done;
      localStorage.setItem('fyt_users', JSON.stringify(users));
      user = users[idx];
      localStorage.setItem('fyt_current_user', JSON.stringify(user));
      renderAll();
      showToast(t.done ? '✓ Tâche complétée !' : 'Tâche remise en cours');
    }

    // ── Init ─────────────────────────────────────────────────────
    function init() {
      // Avatar
      document.getElementById('avatar').textContent = user.name ? user.name[0].toUpperCase() : '?';
      // Greeting
      const h = new Date().getHours();
      const greet = h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
      document.getElementById('greeting-text').textContent = `${greet} ${user.name} 👋`;
      // Date
      const opts = { weekday:'long', day:'numeric', month:'long' };
      document.getElementById('greeting-date').textContent =
        new Date().toLocaleDateString('fr-FR', opts).toUpperCase();
      renderAll();
    }

    function renderAll() {
      const tasks = getUserTasks();
      renderStats(tasks);
      renderScores(tasks);
      renderDays(tasks);
      renderTasks(tasks, activeDay);
    }

    // ── Stats ────────────────────────────────────────────────────
    function renderStats(tasks) {
      const done = tasks.filter(t => t.done).length;
      document.getElementById('stat-total').textContent   = tasks.length;
      document.getElementById('stat-done').textContent    = done;
      document.getElementById('stat-pending').textContent = tasks.length - done;
    }

    // ── Scores ───────────────────────────────────────────────────
    function renderScores(tasks) {
      if (!tasks.length) return;
      const counts = { scolaire:0, perso:0, repos:0 };
      tasks.forEach(t => { if (counts[t.type] !== undefined) counts[t.type]++; });
      const total = tasks.length;
      ['scolaire','perso','repos'].forEach(type => {
        const pct = Math.round((counts[type]/total)*100);
        document.getElementById('score-'+type).textContent = pct+'%';
        document.getElementById('bar-'+type).style.width = pct+'%';
      });
    }

    // ── Jours ────────────────────────────────────────────────────
    function renderDays(tasks) {
      const container = document.getElementById('days-scroll');
      container.innerHTML = '';
      JOURS.forEach((j, i) => {
        const dayTasks = tasks.filter(t => t.day === i);
        const chip = document.createElement('div');
        chip.className = 'day-chip' + (i === activeDay ? ' active' : '');
        chip.innerHTML = `
          <div class="day-name">${j}</div>
          <div class="day-count">${dayTasks.length}</div>
          <div class="day-date">${DATES[i]}</div>
        `;
        chip.onclick = () => { activeDay = i; renderAll(); };
        container.appendChild(chip);
      });
    }

    // ── Tâches ───────────────────────────────────────────────────
    function renderTasks(tasks, dayIdx) {
      const list = document.getElementById('tasks-list');
      const label = document.getElementById('tasks-label');
      label.textContent = `TÂCHES — ${JOURS[dayIdx]} ${DATES[dayIdx]}`;
      const dayTasks = tasks.filter(t => t.day === dayIdx);
      list.innerHTML = '';
      if (!dayTasks.length) {
        list.innerHTML = '<div class="empty"><span>🌿</span>Rien de prévu ce jour.<br>Appuie sur + pour ajouter une tâche.</div>';
        return;
      }
      dayTasks.forEach(t => {
        const el = document.createElement('div');
        el.className = `task-item ${t.type}`;
        el.innerHTML = `
          <div class="task-dot ${t.type}"></div>
          <div class="task-info">
            <div class="task-title ${t.done ? 'done' : ''}">${t.emoji || '📌'} ${t.title}</div>
            <div class="task-meta">${t.priority} · ${t.duration}</div>
          </div>
          <div class="task-check ${t.done ? 'checked' : ''}" onclick="toggleTask('${t.id}')">
            ${t.done ? '✓' : ''}
          </div>
        `;
        list.appendChild(el);
      });
    }

    // ── IA Message ───────────────────────────────────────────────
    function updateIAMessage() {
      const tasks = getUserTasks();
      const msgs = [
        "Tu gères ! Continue sur cette lancée, chaque tâche complétée te rapproche de tes objectifs. 💪",
        "Petit à petit, tu prends le contrôle de ton temps. C'est ça la vraie liberté. ⏳",
        "N'oublie pas de te ménager des moments de repos — la productivité vient de l'équilibre. 🌿",
        "Tu as des tâches importantes cette semaine. Commence par la plus difficile le matin. 🔥",
        "Bien gérer son temps, c'est se donner le droit de profiter pleinement de ses loisirs. ✨",
      ];
      if (tasks.length > 0) {
        const m = msgs[Math.floor(Math.random() * msgs.length)];
        document.getElementById('ia-message').textContent = m;
      }
    }

    // ── Navigation ───────────────────────────────────────────────
    function goToAddTask() { window.location.href = 'fyt-add-task.html'; }
    function goToPlanning() { window.location.href = 'fyt-planning.html'; }
    function logout() {
      localStorage.removeItem('fyt_current_user');
      window.location.href = 'fyt-login.html';
    }

    // ── Toast ────────────────────────────────────────────────────
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ── Lancement ────────────────────────────────────────────────
    init();
    updateIAMessage();

    // Écoute les tâches ajoutées depuis l'autre page
    window.addEventListener('focus', () => renderAll());
  </script>
</body>
</html>
